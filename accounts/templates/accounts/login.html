{% extends "base.html" %}

{% block title %}Login | TechShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-3">Login</h3>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-dark w-100">Login</button>
        </form>
        <p class="mt-3 mb-0">No account? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
