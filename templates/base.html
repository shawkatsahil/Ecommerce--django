<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TechShop{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'store:product_list' %}">🛒 TechShop</a>
      <div class="d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'orders:order_list' %}">My Orders</a>
          <span class="text-white mx-2">Hi, {{ user.username }}</span>
          <form action="{% url 'accounts:logout' %}" method="post" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
          </form>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'accounts:login' %}">Login</a>
          <a class="btn btn-light btn-sm" href="{% url 'accounts:signup' %}">Sign up</a>
        {% endif %}
        <a class="btn btn-warning btn-sm" href="{% url 'cart:cart_detail' %}">
          Cart ({{ cart|length }})
        </a>
      </div>
    </div>
  </nav>

  <div class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
